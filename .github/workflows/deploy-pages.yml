name: Validate and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.app.json

      - name: Unit and UI tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify output assets
        run: |
          test -f dist/index.html
          # Deep GitHub Pages routes must load root-absolute JS/CSS assets.
          grep -Eq 'src="/assets/' dist/index.html
          grep -Eq 'href="/assets/' dist/index.html
          test -f dist/404.html
          test -f dist/og-card.png
          test -f dist/resume.pdf
          for project in computerpilot-mcp tenant-rag psychology-atlas; do
            test -f "dist/case-studies/$project/index.html"
            grep -Fq "https://dibbed.github.io/case-studies/$project/" "dist/case-studies/$project/index.html"
            grep -Eq 'src="/assets/' "dist/case-studies/$project/index.html"
          done
          test -f dist/sitemap.xml
          test -f dist/robots.txt

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
